podAnnotations:
  reloader.stakater.com/auto: "true"
githubConfigUrl: https://github.com/ajaykumar4/home-lab
githubConfigSecret: home-lab-runner-secret
minRunners: ${minRunners:=1}
maxRunners: ${maxRunners:=2} #Double total nodes
containerMode:
  type: kubernetes
  kubernetesModeWorkVolumeClaim:
    accessModes: ["ReadWriteOnce"]
    storageClassName: longhorn
    resources:
      requests:
        storage: 25Gi
controllerServiceAccount:
  name: actions-runner-controller
  namespace: actions-runner-system
template:
  spec:
    containers:
      - name: runner
        image: ghcr.io/home-operations/actions-runner:2.337.0@sha256:8b8e8326b5a08e658a0a41cfd2867afab69ca4194a152f986aa6fcd5430d09e7
        command:
          - /home/runner/run.sh
        env:
          - name: ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
            value: "false"
          - name: NODE
            valueFrom:
              fieldRef:
                fieldPath: status.hostIP
        volumeMounts:
          - mountPath: /var/run/secrets/talos.dev
            name: talos
            readOnly: true
    serviceAccountName: home-lab-runner
    volumes:
      - name: talos
        secret:
          secretName: home-lab-runner
